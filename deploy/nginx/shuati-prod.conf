# /etc/nginx/conf.d/shuati.conf
#
# Cloudflare 代理后的生产配置：
# - 使用 CF-Connecting-IP 作为真实客户端 IP
# - HTTPS 使用 Let's Encrypt 证书
# - 保留后端 Redis 限流与 Nginx 边缘限流两层保护

map $http_cf_connecting_ip $shuati_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $shuati_real_ip zone=shuati_global:10m rate=5r/s;
limit_req_zone $shuati_real_ip zone=shuati_auth:10m rate=1r/s;

server {
    listen 80;
    server_name seaunit.site www.seaunit.site;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name seaunit.site www.seaunit.site;

    ssl_certificate     /etc/letsencrypt/live/seaunit.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seaunit.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/shuati/frontend;
    index index.html;
    client_max_body_size 20m;
    limit_req_status 429;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 安卓安装包与版本清单（宪法 v1.3.0：发布产物放这里，不进 Git）
    # 用 root + 目录名映射（不用 alias，避免 try_files 与 alias 的经典坑）：
    #   /apk/shuati-android.apk -> /opt/shuati/apk/shuati-android.apk
    # 注意别用 /download/：SPA 的下载页正好是 /download，两者会撞车
    #
    # 这段曾经只加在 HTTP 那份 shuati.conf 里，线上 HTTPS 配置漏了，结果 /apk/*
    # 掉进下面 location / 的 SPA 回退，把首页 HTML 当安装包发出去（2KB 的"apk"）。
    location /apk/ {
        root /opt/shuati;
        # 目录里没有的文件要老实 404，不能被 SPA 回退成首页
        try_files $uri =404;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff";
        # 稳定别名的 URL 每版都一样：让缓存每次回来问一句，别把上一版的包发出去
        # （带版本号的那份走下面的长缓存规则）。注意 add_header 不会从上层继承。
        add_header Cache-Control "no-cache";
    }

    # 版本清单要即时生效：下载页读它显示版本号，不能被缓存住
    location = /apk/latest.json {
        root /opt/shuati;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # 带版本号的安装包内容不变，可以长缓存
    location ~ ^/apk/shuati-android-\d+\.\d+\.\d+\.apk$ {
        root /opt/shuati;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 验证类 .html 必须真实存在：否则会被 SPA 回退成 index.html（200 + 页面代码），
    # 搜索引擎的文件校验会失败，而且这份错误响应还可能被 CDN 缓存下来。
    location ~ ^/[A-Za-z0-9_.\-]+\.html$ {
        try_files $uri =404;
    }

    # SEO：首页落地页 / 公共题库页 / sitemap 由后端直出 HTML，蜘蛛不用执行 JS
    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $shuati_real_ip;
        proxy_set_header X-Forwarded-For $shuati_real_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $shuati_real_ip;
        proxy_set_header X-Forwarded-For $shuati_real_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /bank/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $shuati_real_ip;
        proxy_set_header X-Forwarded-For $shuati_real_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/auth/ {
        limit_req zone=shuati_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $shuati_real_ip;
        proxy_set_header X-Forwarded-For $shuati_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=shuati_global burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $shuati_real_ip;
        proxy_set_header X-Forwarded-For $shuati_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location /captcha/ {
        limit_req zone=shuati_global burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $shuati_real_ip;
        proxy_set_header X-Forwarded-For $shuati_real_ip;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $shuati_real_ip;
        proxy_set_header X-Forwarded-For $shuati_real_ip;
    }

    location /pay/webhooks/ {
        proxy_pass http://127.0.0.1:8090/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $shuati_real_ip;
        proxy_set_header X-Forwarded-For $shuati_real_ip;
        proxy_set_header X-Forwarded-Proto https;
    }
}
