# /etc/nginx/conf.d/shuati.conf
#
# 边缘全局限流（http 上下文，先于后端生效）：
#   shuati_global —— 所有业务接口：每 IP 5 请求/秒，突发 20
#   shuati_auth   —— 登录/注册：每 IP 1 请求/秒，突发 5（更严）
# 后端还有一层基于 Redis 的限流（按 IP / 用户 / 分钟），两层互补。
limit_req_zone $binary_remote_addr zone=shuati_global:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=shuati_auth:10m rate=1r/s;

server {
    listen 80;
    server_name seaunit.site www.seaunit.site;

    root /opt/shuati/frontend;
    index index.html;

    # 文档导入走 base64，最大约 2.5MB，这里给足余量
    client_max_body_size 20m;

    limit_req_status 429;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 安卓安装包与版本清单（宪法 v1.3.0：发布产物放这里，不进 Git）
    # 用 root + 目录名映射（不用 alias，避免 try_files 与 alias 的经典坑）：
    #   /apk/shuati-android.apk -> /opt/shuati/apk/shuati-android.apk
    # 注意别用 /download/：SPA 的下载页正好是 /download，两者会撞车
    location /apk/ {
        root /opt/shuati;
        # 目录里没有的文件要老实 404，不能被 SPA 回退成首页
        try_files $uri =404;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff";
    }

    # 版本清单要即时生效：下载页读它显示版本号，不能被缓存住
    location = /apk/latest.json {
        root /opt/shuati;
        try_files $uri =404;
        add_header Cache-Control "no-store";
    }

    # 带版本号的安装包内容不变，可以长缓存
    location ~ ^/apk/shuati-android-\d+\.\d+\.\d+\.apk$ {
        root /opt/shuati;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 验证类 .html 必须真实存在：否则会被 SPA 回退成 index.html（200 + 页面代码），
    # 搜索引擎的文件校验会失败，而且这份错误响应还可能被 CDN 缓存下来。
    location ~ ^/[A-Za-z0-9_.\-]+\.html$ {
        try_files $uri =404;
    }

    # SEO：首页落地页 / 公共题库页 / sitemap 由后端直出 HTML，蜘蛛不用执行 JS
    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /bank/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 登录 / 注册：更严格的限流
    location /api/auth/ {
        limit_req zone=shuati_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=shuati_global burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 验证码接口（获取图片 / 校验），未登录也要能访问
    location /captcha/ {
        limit_req zone=shuati_global burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # Waffo 支付回调：只暴露 webhooks 路径，支付侧车的 /checkout 仅限内网调用
    location /pay/webhooks/ {
        proxy_pass http://127.0.0.1:8090/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 生产建议：
    #   1) 加 HTTPS（listen 443 ssl + 证书）并把 80 端口 301 跳到 443
    #   2) 开启 HSTS：add_header Strict-Transport-Security "max-age=31536000" always;
    #   3) 如机器资源有限，可用 limit_conn 再限制单 IP 并发连接数
}

