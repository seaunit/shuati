# /etc/nginx/conf.d/shuati.conf
#
# 边缘全局限流（http 上下文，先于后端生效）：
#   shuati_global —— 所有业务接口：每 IP 5 请求/秒，突发 20
#   shuati_auth   —— 登录/注册：每 IP 1 请求/秒，突发 5（更严）
# 后端还有一层基于 Redis 的限流（按 IP / 用户 / 分钟），两层互补。
limit_req_zone $binary_remote_addr zone=shuati_global:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=shuati_auth:10m rate=1r/s;

server {
    listen 80;
    server_name shuati.example.com;

    root /opt/shuati/frontend;
    index index.html;

    # 文档导入走 base64，最大约 2.5MB，这里给足余量
    client_max_body_size 20m;

    limit_req_status 429;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 登录 / 注册：更严格的限流
    location /api/auth/ {
        limit_req zone=shuati_auth burst=5 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /api/ {
        limit_req zone=shuati_global burst=20 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 验证码接口（获取图片 / 校验），未登录也要能访问
    location /captcha/ {
        limit_req zone=shuati_global burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # 生产建议：
    #   1) 加 HTTPS（listen 443 ssl + 证书）并把 80 端口 301 跳到 443
    #   2) 开启 HSTS：add_header Strict-Transport-Security "max-age=31536000" always;
    #   3) 如机器资源有限，可用 limit_conn 再限制单 IP 并发连接数
}
