app:
  description: 拾题简答题判分工作流
  icon: "📝"
  icon_background: "#E8F3E8"
  icon_type: emoji
  mode: workflow
  name: shuati-judge
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.26@bdf47cb41e9062bba00d26625d2a795c1874011d8ce64bff738c44b5a31787ea
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: llm
        id: start-to-judge
        source: start_node
        sourceHandle: source
        target: judge_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: end
        id: judge-to-end
        source: judge_llm
        sourceHandle: source
        target: end_node
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ""
          selected: false
          title: 开始
          type: start
          variables:
            - label: 题目
              max_length: 100000
              options: []
              required: true
              type: text-input
              variable: questionContent
            - label: 评分要点
              max_length: 20000
              options: []
              required: false
              type: text-input
              variable: keyPoints
            - label: 参考答案
              max_length: 50000
              options: []
              required: true
              type: text-input
              variable: referenceAnswer
            - label: 考生答案
              max_length: 50000
              options: []
              required: true
              type: text-input
              variable: userAnswer
        height: 90
        id: start_node
        position:
          x: 30
          y: 227
        positionAbsolute:
          x: 30
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 使用参考答案和评分要点批改简答题
          title: DeepSeek 判分
          type: llm
          model:
            provider: langgenius/deepseek/deepseek
            name: deepseek-flash
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - role: system
              text: |
                你是资深的面试官，正在批改面试简答题。考生答案可能是文字论述、解题思路或伪代码；若为伪代码或思路，重点评判逻辑正确性、边界条件处理与思路完整性，不要求语法精确。
                请根据题目、参考答案以及（若提供）评分要点评判考生答案。
                要求：
                1. 逐条核对评分要点是否被覆盖；
                2. verdict 只能是 CORRECT、PARTIAL、WRONG 之一；
                3. score 为 0 到 10 的整数；
                4. hit_points 列出命中的要点，missed_points 列出遗漏的要点；
                5. 如果没有评分要点，先根据题目和参考答案提炼 3 到 5 条要点再评判；
                6. feedback 用中文给出 100 到 600 字的评语与讲解；
                7. 若题目要求代码、SQL、算法或伪代码，feedback 必须包含 Markdown 代码块，默认使用 Java 风格并标注 java；只有题目明确指定其他语言时才使用该语言；
                8. 非代码题不要强行添加代码块；
                9. 只输出 JSON 对象，禁止输出 JSON 之外的内容。
                JSON 格式：{"verdict":"CORRECT|PARTIAL|WRONG","score":0,"hit_points":[],"missed_points":[],"feedback":"..."}
            - role: user
              text: |
                【题目】
                {{#start_node.questionContent#}}

                【评分要点】
                {{#start_node.keyPoints#}}

                【参考答案】
                {{#start_node.referenceAnswer#}}

                【考生答案】
                {{#start_node.userAnswer#}}
          vision:
            enabled: false
            configs:
              variable_selector: []
          memory:
            enabled: false
            window:
              enabled: false
              size: 50
          context:
            enabled: false
            variable_selector: []
          structured_output:
            enabled: false
          retry_config:
            enabled: false
            max_retries: 1
            retry_interval: 1000
            exponential_backoff:
              enabled: false
              multiplier: 2
              max_interval: 10000
        height: 90
        id: judge_llm
        position:
          x: 334
          y: 227
        positionAbsolute:
          x: 334
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ""
          outputs:
            - value_selector:
                - judge_llm
                - text
              value_type: string
              variable: result
          selected: false
          title: 结束
          type: end
        height: 90
        id: end_node
        position:
          x: 638
          y: 227
        positionAbsolute:
          x: 638
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
