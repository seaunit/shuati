app:
  description: 拾题文本和笔记出题工作流
  icon: "📚"
  icon_background: "#E8F0FF"
  icon_type: emoji
  mode: workflow
  name: shuati-extract-text
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.26@bdf47cb41e9062bba00d26625d2a795c1874011d8ce64bff738c44b5a31787ea
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: llm
        id: start-to-extract
        source: start_node
        sourceHandle: source
        target: extract_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: end
        id: extract-to-end
        source: extract_llm
        sourceHandle: source
        target: end_node
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ""
          selected: false
          title: 开始
          type: start
          variables:
            - label: 学习资料
              max_length: 100000
              options: []
              required: true
              type: text-input
              variable: sourceText
        height: 90
        id: start_node
        position:
          x: 30
          y: 227
        positionAbsolute:
          x: 30
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 将试卷、笔记或学习资料转换为题目 JSON
          title: DeepSeek 出题
          type: llm
          model:
            provider: langgenius/deepseek/deepseek
            name: deepseek-flash
            mode: chat
            completion_params:
              temperature: 0.2
          prompt_template:
            - role: system
              text: |
                你是题库构建助手。用户会给一段学习资料。你必须先判断资料形态，再决定处理方式。
                试卷模式：出现试卷或面试题标题、题号、小问、请写出、请实现、请说明、要求如下、输入、输出、打印要求、备注等任一特征时，只做原题抽取，不得新增、改写或派生题目。
                学习资料模式：只有资料确实没有现成问题，只是讲解、笔记或知识点时，才把资料转换成练习题。
                输出只允许一个 JSON 对象，格式：
                {"questions":[{"unit":"单元名","type":"SINGLE|MULTI|SHORT","content":"题干 Markdown","options":[{"key":"A","text":"选项内容"}],"answer":"正确答案","key_points":["判分要点"],"difficulty":"EASY|MEDIUM|HARD","explanation":"解析"}]}
                规则：
                1. 试卷模式下必须保留原题号、小问、输入、返回、打印要求、备注和候选项，不得漏题；
                2. 一个顶层题号只对应一道题，题内多个要求不得拆题；
                3. 没有显式选项时必须使用 SHORT，不得虚构 A/B/C/D；
                4. “以下题目 2 选 1”时每个候选项各输出一道 SHORT；
                5. 表格转成 Markdown，依赖同一上下文的每道题都写入完整上下文；
                6. 没有章节标题时 unit 填「未分类」；
                7. 学习资料模式才允许生成 5 到 10 道新题，答案不得编造；
                8. 代码和公式保持原结构，生成伪代码时默认 Java 风格并标注 java；
                9. 只输出 JSON，不要解释。
            - role: user
              text: |
                {{#start_node.sourceText#}}
          vision:
            enabled: false
            configs:
              variable_selector: []
          memory:
            enabled: false
            window:
              enabled: false
              size: 50
          context:
            enabled: false
            variable_selector: []
          structured_output:
            enabled: false
          retry_config:
            enabled: false
            max_retries: 1
            retry_interval: 1000
            exponential_backoff:
              enabled: false
              multiplier: 2
              max_interval: 10000
        height: 90
        id: extract_llm
        position:
          x: 334
          y: 227
        positionAbsolute:
          x: 334
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ""
          outputs:
            - value_selector:
                - extract_llm
                - text
              value_type: string
              variable: result
          selected: false
          title: 结束
          type: end
        height: 90
        id: end_node
        position:
          x: 638
          y: 227
        positionAbsolute:
          x: 638
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
