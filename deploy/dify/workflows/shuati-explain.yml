app:
  description: 拾题 AI 解析工作流
  icon: "💡"
  icon_background: "#FFF3D6"
  icon_type: emoji
  mode: workflow
  name: shuati-explain
  use_icon_as_answer_icon: false
dependencies:
  - current_identifier: null
    type: marketplace
    value:
      marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.26@bdf47cb41e9062bba00d26625d2a795c1874011d8ce64bff738c44b5a31787ea
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ""
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: start
          targetType: llm
        id: start-to-explain
        source: start_node
        sourceHandle: source
        target: explain_llm
        targetHandle: target
        type: custom
        zIndex: 0
      - data:
          isInIteration: false
          isInLoop: false
          sourceType: llm
          targetType: end
        id: explain-to-end
        source: explain_llm
        sourceHandle: source
        target: end_node
        targetHandle: target
        type: custom
        zIndex: 0
    nodes:
      - data:
          desc: ""
          selected: false
          title: 开始
          type: start
          variables:
            - label: 题目
              max_length: 100000
              options: []
              required: true
              type: text-input
              variable: questionContent
            - label: 选项
              max_length: 50000
              options: []
              required: false
              type: text-input
              variable: options
            - label: 正确答案
              max_length: 20000
              options: []
              required: true
              type: text-input
              variable: referenceAnswer
        height: 90
        id: start_node
        position:
          x: 30
          y: 227
        positionAbsolute:
          x: 30
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: 针对题目本身生成 Markdown 解析
          title: DeepSeek 解析
          type: llm
          model:
            provider: langgenius/deepseek/deepseek
            name: deepseek-flash
            mode: chat
            completion_params:
              temperature: 0.3
          prompt_template:
            - role: system
              text: |
                你是 Java 面试讲师。根据题目、选项和正确答案，输出一段 Markdown 解析。
                要求：
                1. 开篇点明正确答案并说明原因；
                2. 逐个选项简述为什么对或为什么错；
                3. 适当补充面试考点延伸；
                4. 若需要写伪代码，默认使用 Java 风格并标注 java；题目明确指定其他语言时除外；
                5. 解析只针对题目本身，禁止提及任何考生的作答、选择或对错；
                6. 300 字以内，直接输出 Markdown，不要输出 JSON。
            - role: user
              text: |
                【题目】
                {{#start_node.questionContent#}}

                【选项】
                {{#start_node.options#}}

                【正确答案】{{#start_node.referenceAnswer#}}
          vision:
            enabled: false
            configs:
              variable_selector: []
          memory:
            enabled: false
            window:
              enabled: false
              size: 50
          context:
            enabled: false
            variable_selector: []
          structured_output:
            enabled: false
          retry_config:
            enabled: false
            max_retries: 1
            retry_interval: 1000
            exponential_backoff:
              enabled: false
              multiplier: 2
              max_interval: 10000
        height: 90
        id: explain_llm
        position:
          x: 334
          y: 227
        positionAbsolute:
          x: 334
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
      - data:
          desc: ""
          outputs:
            - value_selector:
                - explain_llm
                - text
              value_type: string
              variable: explanation
          selected: false
          title: 结束
          type: end
        height: 90
        id: end_node
        position:
          x: 638
          y: 227
        positionAbsolute:
          x: 638
          y: 227
        selected: false
        sourcePosition: right
        targetPosition: left
        type: custom
        width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
  rag_pipeline_variables: []
