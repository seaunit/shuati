spring:
  datasource:
    url: ${SHUATI_DB_URL}
    username: ${SHUATI_DB_USER}
    password: ${SHUATI_DB_PASSWORD}
  flyway:
    baseline-on-migrate: false

logging:
  level:
    root: INFO
    com.shuati: INFO

shuati:
  cookie:
    # 正式环境必须 true（HTTPS）；纯 IP + HTTP 的临时 demo 可设 false
    secure: ${SHUATI_COOKIE_SECURE:true}
  jwt:
    secret: ${SHUATI_JWT_SECRET}
    ttl-seconds: 604800
