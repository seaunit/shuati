spring:
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
  application:
    name: shuati
  profiles:
    active: local
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SHUATI_REDIS_HOST:127.0.0.1}
      port: ${SHUATI_REDIS_PORT:6379}
      password: ${SHUATI_REDIS_PASSWORD:}
      database: ${SHUATI_REDIS_DB:0}
      timeout: 3s
  mail:
    host: ${SHUATI_MAIL_HOST:}
    port: ${SHUATI_MAIL_PORT:465}
    username: ${SHUATI_MAIL_USERNAME:}
    password: ${SHUATI_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SHUATI_MAIL_SSL:true}
      mail.smtp.connectiontimeout: ${SHUATI_MAIL_CONNECT_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${SHUATI_MAIL_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SHUATI_MAIL_WRITE_TIMEOUT_MS:10000}

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # 邮件发送可用性不参与应用 readiness；未配置 SMTP 时不能被健康检查阻断部署。
      enabled: false

shuati:
  ai:
    # local 默认由 application-local.yml 切到 dify；生产保持 direct
    engine: ${SHUATI_AI_ENGINE:direct}
  dify:
    base-url: ${DIFY_BASE_URL:http://localhost:8501/v1}
    connect-timeout: ${DIFY_CONNECT_TIMEOUT:10s}
    read-timeout: ${DIFY_READ_TIMEOUT:175s}
    workflows:
      judge: ${DIFY_WORKFLOW_JUDGE_TOKEN:}
      explain: ${DIFY_WORKFLOW_EXPLAIN_TOKEN:}
      ask: ${DIFY_WORKFLOW_ASK_TOKEN:}
      extract-text: ${DIFY_WORKFLOW_EXTRACT_TEXT_TOKEN:}
      extract-image: ${DIFY_WORKFLOW_EXTRACT_IMAGE_TOKEN:}
  explain-queue:
    # 解析结果落库改走 Redis Streams 异步消费：结果先返回给用户，写库在后台做。
    # 投递失败会自动退化成本次同步写库，不会丢解析结果。
    enabled: true
    # 消费者轮询间隔（毫秒）
    poll-ms: 2000
  payments:
    # 是否启用在线支付（启用后下单会调用 Node 支付侧车创建 Waffo 收银台）
    enabled: ${SHUATI_PAYMENTS_ENABLED:false}
    base-url: ${SHUATI_PAYMENTS_URL:http://127.0.0.1:8090}
    # 与支付侧车共享的密钥，务必改成随机值
    internal-secret: ${SHUATI_PAYMENTS_SECRET:}
    # 一次性支付（点数包）币种
    currency: ${SHUATI_PAYMENTS_CURRENCY:CNY}
    # 订阅币种：Waffo 平台不支持订阅用 CNY，固定用 USD
    subscription-currency: ${SHUATI_PAYMENTS_SUBSCRIPTION_CURRENCY:USD}
  rate-limit:
    enabled: true
    # 同一 IP 每分钟请求总量兜底（拦脚本扫描），0=关闭
    global-per-minute: 300
  limits:
    # 自建题库数量上限：所有账号相同，不属于付费权益
    max-banks: ${SHUATI_MAX_BANKS:20}
  captcha:
    # 图形验证码有效期（秒），写入 Redis TTL 自动过期
    ttl-seconds: 120
    # 单个 ticket 允许的最大校验次数，超过直接作废
    max-attempts: 5
    code-length: 4
    width: 150
    height: 48
    # true=加盐哈希存储（默认，推荐）；false=明文存储
    hash-store: true
    secret: ${SHUATI_CAPTCHA_SECRET:shuati-captcha-secret-please-change}
    # IP / 设备维度限流：每分钟最多申请次数
    ip-limit-per-minute: 20
    device-limit-per-minute: 20
  email:
    enabled: ${SHUATI_MAIL_ENABLED:false}
    # 仅本地测试环境使用：验证码打印到控制台，不连接 SMTP
    simulate: ${SHUATI_MAIL_SIMULATE:false}
    from: ${SHUATI_MAIL_FROM:}
    from-name: ${SHUATI_MAIL_FROM_NAME:拾题}
    secret: ${SHUATI_EMAIL_SECRET:}
    code-ttl-seconds: ${SHUATI_MAIL_CODE_TTL_SECONDS:300}
    cooldown-seconds: ${SHUATI_MAIL_COOLDOWN_SECONDS:60}
    max-attempts: 5
    email-daily-limit: ${SHUATI_MAIL_EMAIL_DAILY_LIMIT:10}
    ip-hourly-limit: ${SHUATI_MAIL_IP_HOURLY_LIMIT:20}
    device-daily-limit: ${SHUATI_MAIL_DEVICE_DAILY_LIMIT:30}
    global-daily-limit: ${SHUATI_MAIL_GLOBAL_DAILY_LIMIT:2000}
  seo:
    # canonical / sitemap / robots 里写的规范域名，要和百度搜索资源平台验证过的站点一致
    site-url: ${SHUATI_SITE_URL:https://www.seaunit.site}
    site-name: ${SHUATI_SITE_NAME:拾题}
    tagline: ${SHUATI_SITE_TAGLINE:在线刷题与 AI 解析}
    description: ${SHUATI_SITE_DESCRIPTION:拾题提供软考等考试的真题题库，选择题和判断题本地判分、简答题 AI 判分，还能把自己的讲义或真题文档一键变成可以刷的题库。}
    keywords: ${SHUATI_SITE_KEYWORDS:拾题,在线刷题,软考真题,软考题库,AI判题,AI解析,错题本,题库生成}
    contact-email: ${SHUATI_CONTACT_EMAIL:sealevel666@163.com}
    # 百度统计站点 ID（公开标识），留空则不注入统计脚本
    baidu-tongji-id: ${SHUATI_BAIDU_TONGJI_ID:639e5d48916802a7505c8af19d7002e7}
    # Google Search Console 选「HTML 标记」验证时填这里，留空则不输出该 meta
    google-site-verification: ${SHUATI_GOOGLE_SITE_VERIFICATION:}
    # GA4 衡量 ID（G-XXXXXXX）：公开标识，内置为默认值；留空则不注入统计脚本
    google-analytics-id: ${SHUATI_GA_MEASUREMENT_ID:G-S2H8MP4FYT}
  abuse:
    # 一次性邮箱域名：内置名单在 classpath:abuse/disposable-domains.txt，
    # 这里填的（逗号分隔）会追加到内置名单上
    blocked-email-domains: ${SHUATI_BLOCKED_EMAIL_DOMAINS:}
    # 同一 IP 的注册频率（0 = 关闭）
    register-ip-hourly-limit: ${SHUATI_REGISTER_IP_HOURLY_LIMIT:3}
    register-ip-daily-limit: ${SHUATI_REGISTER_IP_DAILY_LIMIT:10}
    # 新账号 24 小时内的 AI 调用上限（0 = 关闭）
    new-account-ai-daily-limit: ${SHUATI_NEW_ACCOUNT_AI_DAILY_LIMIT:30}
