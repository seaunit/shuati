<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>拾题</title>
    <style>
      :root {
        /* 与网页端页面底色（--color-paper）保持一致，三处接力时不跳色 */
        --bg: #ffffff;
        --badge: #eef1ee;
        --leaf: #7d9b76;
        --ink: #1a1a1a;
        --gray: #8a8f98;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.25s ease;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body.ready {
        opacity: 1;
      }

      .badge {
        width: 96px;
        height: 96px;
        border-radius: 28px;
        background: var(--badge);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .badge svg {
        width: 56px;
        height: 56px;
      }

      h1 {
        margin: 22px 0 0;
        font-size: 34px;
        font-weight: 700;
      }

      p {
        margin: 10px 0 0;
        font-size: 15px;
        color: var(--gray);
      }

      .hint {
        position: fixed;
        bottom: 32px;
        font-size: 12px;
        color: #b2b2b2;
      }
    </style>
  </head>
  <body>
    <!-- 叶子路径与网页端 frontend/public/favicon.svg 逐字一致 -->
    <div class="badge">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="var(--leaf)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
        <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
      </svg>
    </div>
    <h1>拾题</h1>
    <p>安静地练习，温柔地记住</p>
    <div class="hint">正在进入…</div>

    <script>
      // 站点入口：**一处可配**（宪法 v1.2.0 要求写明远端加载还是本地资源）。
      // 模式仍是「本地启动页 → 远端应用」：启动页是本地文件、不依赖网络，秒开；
      // 展示品牌后再跳到线上应用，App 里的界面始终与网页端同一份实现。
      // 跳转目标必须同时写进 capacitor.config.ts 的 server.allowNavigation，否则会被系统浏览器接管。
      //
      // 品牌为什么会一直亮着：跳过去之后等远端首帧的那几百毫秒，露出的是**窗口背景**
      // （res/drawable/splash_brand.xml 里同一张品牌图，WebView 背景设成透明）。
      // 所以这里**不能**先把自己淡出再跳——那 200ms 的空白就是这么来的。
      var SITE_URL = "https://www.seaunit.site/app/";

      // 品牌至少露出这么久，避免一闪而过
      var MIN_SHOW_MS = 700;
      // 预热最多等这么久；等不到也先进，剩下的由窗口背景接着兜
      var MAX_WARM_MS = 1200;
      var startedAt = Date.now();
      var entered = false;

      document.body.classList.add("ready");

      function enterSite() {
        if (entered) return;
        entered = true;
        // 不淡出：保持启动页画着，让下一份文档的首帧接上来
        window.location.replace(SITE_URL);
      }

      // 预热连接（跨海链路握手不便宜），跳过去能更快出首帧
      var warm;
      try {
        warm = fetch(SITE_URL, { mode: "no-cors" }).catch(function () {});
      } catch (error) {
        warm = Promise.resolve(); // 预热失败不影响跳转
      }

      var warmSettled = Promise.race([
        Promise.resolve(warm),
        new Promise(function (resolve) {
          setTimeout(resolve, MAX_WARM_MS);
        }),
      ]);

      warmSettled.then(function () {
        setTimeout(enterSite, Math.max(0, MIN_SHOW_MS - (Date.now() - startedAt)));
      });
    </script>
  </body>
</html>
