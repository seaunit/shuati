name: 安卓包发布

# 打 tag（android-v1.0.0）就自动出包并发 Release；
# 服务器部署时由 deploy/scripts/provision-ubuntu.sh 从 Release 拉取，不需要本地上传。
on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 用当前 major 版本：旧版会被 GitHub 标记为已弃用（node20 强制跑 node24）
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Capacitor 8 的 Android 模板要求 JDK 21；build-android.mjs 会自动识别 JAVA_HOME
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 校验 tag 与版本号一致
        # 手动触发（workflow_dispatch）时没有 tag，版本号以 version.properties 为准
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="$(sed -n 's/^versionName[[:space:]]*=[[:space:]]*//p' mobile/version.properties)"
          if [ "$GITHUB_REF_NAME" != "android-v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME 与 mobile/version.properties 的 v$VERSION 不一致" >&2
            exit 1
          fi

      - name: 安装壳工程依赖
        run: cd mobile && npm ci

      # 出包 → 生成带版本号产物 + 稳定别名 + latest.json，并用 GITHUB_TOKEN 发 Release
      - name: 出包并发布 Release
        run: cd mobile && npm run publish:apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
